sweep:
  name: extended_small_ecology_screen

  params:
    # Abiotic forcing
    model.a: [2.0, 3.0]          # rainfall: dry, intermediate, wet
    model.v: [120.0, 182.5]            # runoff/advection: gentle vs steep-slope flow

    # Whole-community water feedback
    model.alpha: [1.0]           # weaker vs stronger biomass-water uptake feedback

    # Grass dynamics
    model.b1: [1.0]
    model.m1: [0.45]            # grass mortality: persistent vs stressed grass
    model.d1: [1.0]              # grass dispersal/spread: local vs mobile grass

    # Woody recruitment and maturation
    model.phi: [0.05, 0.21, 0.45]           # tree-driven sapling recruitment / seed rain
    model.gamma: [0.10, 0.15, 0.20]         # sapling-to-tree maturation: slow vs fast

    # Sapling
    model.b2: [0.5, 0.8]
    model.m2: [0.3]
    model.d2: [0.5]

    # Adult tree persistence
    model.b3: [0.2, 0.8]            # tree water absorption: drought-sensitive vs drought-tolerant trees
    model.m3: [0.15, 0.5]            # tree mortality: long-lived vs drought-sensitive trees

    # Keep sweeps lighter
    output.save_animation: [true]
    output.save_plot: [true]

  eq_branch: [E1+, E2, E_all]